extension:
  name: xmla
  description: "Query SQL Server Analysis Services over the native XMLA/TCP binding, from Linux — no IIS, no COM, no Windows components."
  version: "0.0.1"
  language: "C++"
  build: "cmake"
  license: "Apache-2.0"
  maintainers:
    - "oluies"
    - "VGSML"
  # Windows is excluded on purpose rather than by omission: a Windows user
  # already has msolap, and the whole point of this extension is to reach SSAS
  # without COM.
  #
  # macOS is excluded because a macOS build cannot be REDISTRIBUTED. Apple's
  # GSS.framework exports no gss_wrap_iov and no NTLM mechanism, so it cannot
  # seal a message at all and MIT krb5 from Homebrew is the only option there.
  # Homebrew's krb5 is keg-only and ships no static archives, so the extension
  # links the dylibs and records their install names verbatim —
  # `otool -L` on the built extension shows
  # /opt/homebrew/opt/krb5/lib/libgssapi_krb5.2.2.dylib. The artifact then loads
  # only on a machine with that exact prefix populated. A registry builder has
  # no Homebrew krb5 at all, so the build would fail there rather than publish
  # something that half works. macOS remains a supported LOCAL build; see the
  # README.
  excluded_platforms: "windows_amd64;windows_amd64_mingw;windows_arm64;osx_amd64;osx_arm64;wasm_mvp;wasm_eh;wasm_threads"

repo:
  github: "hugr-lab/xmla-extention"

  # TWO pins, and BOTH of these invariants apply to BOTH of them. They are
  # stated here once rather than in either field's own comment, because stating
  # them under `ref` alone is how `ref` came to be re-pinned while the pin that
  # actually builds was left stale.
  #
  #   1. An immutable SHA, never a branch name, and it must be on main. The
  #      registry checks out this exact object so a published build is
  #      reproducible; a branch name is silently accepted here and rejected by
  #      the registry's own validation. Confirm with
  #      `git branch -r --contains <sha>`.
  #
  #   2. The tree it names must carry the krb5 declaration in vcpkg.json, or the
  #      registry build fails at configure on our own "no GSSAPI" refusal.
  #
  # Both pins necessarily TRAIL this file by at least one commit: a pin names
  # the tree to build, and the file naming it is submitted to
  # duckdb/community-extensions rather than read from here, so neither can name
  # the commit that sets it. Re-pin BOTH to the current tip of main immediately
  # before each submission. scripts/ci/check_registry_refs.py enforces what can
  # be checked offline; it cannot know whether a pin is current, only whether it
  # is real and on main.
  #
  # Satisfying both invariants is still not enough to submit:
  # test/gss/vcpkg-mech shows a vcpkg-built krb5 ships without the NTLM
  # mechanism, and the port cannot currently be built on the registry's Linux
  # images at all. Read that probe's README first.

  # The tree the STABLE lane builds. Expected to FAIL whatever is pinned here:
  # build.yml sets DUCKDB_LATEST_STABLE to v1.5.5 and feeds `ref` to it, and
  # `ref` is required and cannot be omitted, so a v2.0-only extension is
  # compiled against v1.5.5 headers. Nothing in description.yml opts out of a
  # DuckDB version — excluded_platforms excludes platforms, not versions — so
  # that is a property of the registry to raise with it rather than something to
  # fix by changing this file.
  ref: "4c8d2474939ba7161e1cc82d35bf3929029934fc"

  # The tree the PRERELEASE lane builds, and the only lane that can succeed.
  # build_next.yml calls build.yml with duckdb_version 'v2.0-cyanoptera' and
  # require_ref_next: true, and community-extensions/scripts/build.py uses
  # ref_next whenever DUCKDB_VERSION is not DUCKDB_LATEST_STABLE — so without
  # this field that lane sets extension_ref to None and skips the extension
  # entirely.
  #
  # It is a separate field rather than a duplicate of `ref` because the two
  # lanes build different DuckDB versions from the same repository, and this is
  # the version we actually target: .gitmodules pins the duckdb submodule to
  # branch v2.0-cyanoptera, and the source is v2.0-only (ExtensionLoader,
  # DUCKDB_CPP_EXTENSION_ENTRY, vector<Identifier>, SetChildCardinality, the
  # v2.0 StorageExtension/catalog surface). The two pins hold the same SHA
  # today; nothing keeps them equal, and they diverge the moment main carries a
  # commit only one lane should build, which is why they stay distinct fields.
  ref_next: "4c8d2474939ba7161e1cc82d35bf3929029934fc"

docs:
  hello_world: |
    INSTALL xmla FROM community;
    LOAD xmla;

    CREATE SECRET ssas (TYPE xmla, MECHANISM 'ntlm', USER 'reader', PASSWORD '...');
    ATTACH 'host=ssas-host port=2383 secret=ssas' AS aw (TYPE xmla);

    SHOW ALL TABLES;
    SELECT * FROM aw."Adventure Works".DimProduct LIMIT 10;

    -- or without ATTACH, for metadata and DAX
    SELECT CUBE_NAME FROM xmla_discover('host=ssas-host port=2383 secret=ssas', 'MDSCHEMA_CUBES');
    SELECT * FROM xmla_execute('host=ssas-host port=2383 secret=ssas', 'EVALUATE Sales');

  extended_description: |
    Reads SQL Server Analysis Services over the **native XMLA/TCP binding**, so a
    Linux client needs no IIS, no msmdpump, no COM and no MSOLAP provider.

    DuckDB's existing `msolap` extension reaches Analysis Services only on
    Windows, because it binds COM/OLE DB. The alternative — speaking XMLA over
    HTTP — is what forces an IIS deployment in front of every instance.

    Named for the wire protocol rather than a product: the same protocol serves
    SSAS, Azure Analysis Services and Power BI Premium endpoints.

    Status:
    - NTLM works end to end, verified against SQL Server 2022 on tabular and
      multidimensional instances.
    - Kerberos is UNVERIFIED against a live server. The mechanism-level questions
      are settled in CI against an MIT KDC; what remains open is whether a
      Kerberos-speaking SSAS lays out its single token buffer the way this client
      assembles one. It is marked unverified rather than claimed.

    Read-only, in two tiers: metadata by construction (no mutating envelope
    builder exists, and the catalog refuses every mutating plan) and statements
    by validation (the XMLA `<Statement>` element carries the whole command
    surface, so it is checked against a query allowlist). Grant the connecting
    account read-only permissions on the server; that is the only control that
    cannot be reasoned around.

    Tabular models support `SELECT` on their tables. Multidimensional models
    expose their metadata but not row scans: reading rows needs DAX `EVALUATE`,
    and multidimensional data is queried with MDX — use `xmla_execute` for that
    rather than having the extension send a statement the server will reject.
