name: Deploy docs

# Publishes website/ to GitHub Pages at https://hugr-lab.github.io/xmla-extention/
#
# The docs build from MAIN, and Docusaurus VERSIONING keeps released content
# authoritative once the first snapshot exists: `docs:version <X.Y.Z>` snapshots
# docs/ into versioned_docs/, which then serves at the ROOT as the default while
# the live docs/ tree publishes as "Next" under /next/ with an unreleased banner.
# Until that first snapshot, docs/ serves at the root. Same scheme as
# hugr-lab/mssql-ducklake, whose site this one mirrors.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No submodules: the site is markdown and needs neither duckdb nor
      # extension-ci-tools, and checking them out costs minutes.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the docs site
        working-directory: website
        env:
          DOCS_CANONICAL: ${{ vars.DOCS_IONOS == 'true' && 'https://hugr-lab.com/docs/xmla-extention/' || '' }}
        run: |
          npm ci
          npx docusaurus build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

      - id: deployment
        uses: actions/deploy-pages@v4

      # The second copy of the same docs, for https://hugr-lab.com/docs/xmla-extention/ (IONOS):
      # built after the Pages deploy, so an IONOS failure never holds GitHub Pages back.
      # Off until the organization sets DOCS_IONOS=true; this workflow never runs on pull requests.
      - name: Build for hugr-lab.com
        if: ${{ vars.DOCS_IONOS == 'true' }}
        working-directory: website
        env:
          DOCS_TARGET: ionos
        run: npm run build -- --out-dir build-ionos

      - name: Check the hugr-lab.com copy requests no other server
        if: ${{ vars.DOCS_IONOS == 'true' }}
        working-directory: website
        run: |
          found=$(grep -rhoE "(src=\"|srcset=\"|url\(|@import )['\"]?https?://[^\"') ]+" build-ionos | sort -u || true)
          if [ -n "$found" ]; then echo "third-party requests in the hugr-lab.com build:"; echo "$found"; exit 1; fi

      - name: Upload to hugr-lab.com (IONOS)
        if: ${{ vars.DOCS_IONOS == 'true' }}
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE: ${{ vars.IONOS_DOCS_ROOT || '/hugr-lab/docs' }}/xmla-extention
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Mirrors the build into docs/xmla-extention/ on IONOS; nothing outside that folder is touched.
          lftp --env-password -u "$USER" -e "set sftp:auto-confirm yes; set net:max-retries 3; \
            mirror --reverse --delete --verbose website/build-ionos/ $REMOTE; bye" \
            "sftp://$HOST"
