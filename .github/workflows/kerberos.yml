name: Kerberos mechanism

# The most valuable workflow in this repository, and the one that changes what is
# knowable rather than merely re-checking what is known.
#
# SSAS has no Linux build, so there is no way to put a Kerberos-speaking Analysis
# Services instance behind this. There does not need to be: the questions that
# actually block Kerberos are questions about the MECHANISM -- does gss_wrap_iov
# give the detached split, what does the token weigh per enctype, does anything
# pad -- and an MIT KDC with a krb5 acceptor holding the service keytab answers
# all three.
#
# The reference implementation had to mark Kerberos UNVERIFIED because its only
# fixture was a standalone workgroup Windows box that speaks NTLM only. This
# removes that excuse for the client half. It does NOT settle the SSAS half; see
# research D5.

on:
  pull_request:
    paths:
      - 'src/xmla/gss_context.cpp'
      - 'src/xmla/sealing.cpp'
      - 'src/xmla/auth.cpp'
      - 'src/include/xmla/seal_provider.hpp'
      - 'src/include/xmla/gss_context.hpp'
      - 'src/include/xmla/sealing.hpp'
      - 'src/include/xmla/auth.hpp'
      - 'test/gss/**'
      - 'CMakeLists.txt'
      - '.github/workflows/kerberos.yml'
  schedule:
    # A distribution's gss-ntlmssp or krb5 can change what these probes report,
    # and D4's whole finding is about what a plugin does or does not export.
    # Weekly, so a change is found by a scheduled run rather than by a release.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: kerberos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ntlm-mechanism:
    name: NTLM - gss_wrap_iov is unavailable, and the split holds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build the NTLM probe image
        uses: docker/build-push-action@v5
        with:
          context: test/gss/ntlm
          tags: xmla-gss-ntlm:latest
          load: true
          cache-from: type=gha,scope=gss-ntlm
          cache-to: type=gha,scope=gss-ntlm,mode=max

      # This asserts a NEGATIVE and it is deliberate. research D4 rests on
      # gss-ntlmssp exporting no IOV entry points; if a future version starts
      # exporting them, the capability probe in seal_provider picks the other
      # implementation and the reasoning in the docs goes stale. Better to be
      # told.
      - name: gss_wrap_iov is still unavailable for NTLM
        # pipefail, because `docker run | tee` otherwise reports tee's status and
        # the container's exit code is discarded entirely.
        shell: bash -euo pipefail {0}
        run: |
          docker run --rm xmla-gss-ntlm:latest 2>&1 | tee out.txt

          # Assert the POSITIVE for the case we care about. The probe prints
          # "FAIL <stage>" for every stage it can fail at — import_name,
          # acquire_cred, accept_sec_context — so grepping for the absence of
          # "FAIL gss_wrap_iov" reports "gss_wrap_iov now WORKS" whenever a
          # packaging change breaks the handshake before the IOV call is even
          # reached. That is the opposite of what happened, and it sends the
          # reader off to revise a finding that is still true.
          if grep -q "gss_wrap_iov OK" out.txt; then
            echo "gss_wrap_iov now WORKS for NTLM - research D4 needs revisiting"; exit 1
          fi
          if ! grep -q "^FAIL gss_wrap_iov" out.txt; then
            echo "the probe failed somewhere OTHER than gss_wrap_iov - it is broken, not informative"
            grep "^FAIL" out.txt || echo "  (no FAIL line at all)"
            exit 1
          fi
          grep -q "the frame is buildable for NTLM" out.txt \
            || { echo "the gss_wrap token split no longer holds"; exit 1; }

  kerberos-mechanism:
    name: Kerberos - wrap_iov layout against a real KDC
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build the KDC probe image
        uses: docker/build-push-action@v5
        with:
          context: test/gss/kerberos
          tags: xmla-gss-krb:latest
          load: true
          cache-from: type=gha,scope=gss-krb
          cache-to: type=gha,scope=gss-krb,mode=max

      - name: Stand up the KDC and measure every AES enctype
        shell: bash -euo pipefail {0}
        run: docker run --rm xmla-gss-krb:latest 2>&1 | tee out.txt

      - name: Every enctype was actually measured, and none padded
        shell: bash -euo pipefail {0}
        run: |
          # ASSERT ON POSITIVES. The previous version of this step passed green
          # when every measurement failed, and it is worth spelling out why,
          # because the shape recurs: run.sh prints the "session key actually
          # used" line from klist AFTER the probe, whether or not the probe
          # succeeded; it swallows a probe failure with `|| echo "probe exited
          # non-zero"`; and the padding check was a NEGATIVE grep, which also
          # matches nothing when the probe never got far enough to print
          # "PADDING seen:" at all. So all four etype lines appeared, no
          # MISMATCH appeared, no "PADDING seen: ***" appeared, and the job
          # announced "four enctypes measured, none padded" having measured
          # nothing.
          if grep -q "probe exited non-zero" out.txt; then
            echo "the probe failed; the etype lines below it come from klist, not from a measurement"
            exit 1
          fi
          # NOT-ENCRYPTED is only reported for payloads of 8 bytes or more. Below
          # that a byte-inequality test is a coin flip rather than a measurement:
          # a 1-byte ciphertext coincides with its plaintext once in 256 runs,
          # which duly happened here and reported the mechanism broken. Those
          # rows now read "enc-n/a" and still assert length-preservation and the
          # round-trip, which are deterministic.
          for marker in RT-FAILED LEN-CHANGED NOT-ENCRYPTED; do
            if grep -q "$marker" out.txt; then
              echo "a wrap_iov round-trip reported $marker"; exit 1
            fi
          done
          # Absence is not evidence: NOT-ENCRYPTED is legitimately never emitted
          # for the 1-byte row, so "no marker" no longer distinguishes encrypted
          # from not-measured. conf_state is the mechanism's own answer, is
          # asserted at every size, and says so when it is 0.
          if grep -q "conf_state=0" out.txt; then
            echo "the mechanism reported it did not encrypt"; exit 1
          fi
          if grep -q "PADDING seen: \*\*\*" out.txt; then
            echo "an enctype now pads - the frame has no field for it, see research D5"; exit 1
          fi

          # Require the verdict and the padding line ONCE PER ENCTYPE, so a run
          # that measured two and died cannot pass by absence.
          verdicts=$(grep -c "VERDICT: gss_wrap_iov gives the SSAS frame layout" out.txt || true)
          padlines=$(grep -c "PADDING seen: no" out.txt || true)
          if [ "$verdicts" -ne 4 ] || [ "$padlines" -ne 4 ]; then
            echo "expected 4 verdicts and 4 padding lines, got $verdicts and $padlines"; exit 1
          fi

          for e in aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96 \
                   aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128; do
            grep -q "session key actually used: $e" out.txt \
              || { echo "no measurement for $e - the run did not vary the session key"; exit 1; }
          done

          # A run that silently used one principal for every enctype reports four
          # identical rows and looks like a pass. It happened during development.
          # Written as `if`, not `grep -q ... && exit 1`: the && form fails the
          # step when grep finds nothing, which is the healthy case.
          if grep -q "MISMATCH" out.txt; then
            echo "a run used a principal it did not intend - the rows are not four enctypes"; exit 1
          fi
          echo "four enctypes measured and verified, none padded"
