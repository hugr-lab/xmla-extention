name: CI

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter, deliberately. With `branches: [main]` a PR whose base
    # is another branch runs none of this, and stacked PRs are normal. The failure
    # mode is a green tick on a PR that ran four checks instead of fourteen, which
    # looks fine on the page and is only visible by counting them against another
    # PR. Cost is CI minutes on stacked PRs, which is the point.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          find src test tools -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format-14 --dry-run --Werror

      # Constitution I. The gate runs on every commit locally; here it runs over
      # EVERY TRACKED FILE, not just a diff, so a token that arrived before the
      # gate did is still found. LEAK_GATE_FILES_CMD is the supported way to
      # point it at a different file list -- and with it set, scanning zero files
      # is an error rather than a pass, because a green run that checked nothing
      # is worse than no job at all.
      - name: Leak gate over every tracked file
        run: LEAK_GATE_FILES_CMD="git ls-files" .githooks/pre-commit

      - name: The protocol layer stays free of DuckDB and of GSSAPI
        run: scripts/ci/check_layering.sh

  cpp-unit-tests:
    name: C++ Unit Tests (${{ matrix.os.id }})
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is here to catch BSD/Linux socket divergence in transport, which
        # is the layer most likely to differ. It builds the HERMETIC target set
        # only: Apple's GSS.framework exports no gss_wrap_iov and no NTLM
        # mechanism (research D11), so a client build there would fail for a
        # reason that has nothing to do with the change under test.
        os:
          - id: linux
            runner: ubuntu-latest
            require_gss: 'ON'
          - id: macos
            runner: macos-14
            require_gss: 'OFF'
    steps:
      - uses: actions/checkout@v5

      - name: Install GSSAPI (linux)
        if: matrix.os.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev gss-ntlmssp ninja-build

      - name: Install ninja (macos)
        if: matrix.os.id == 'macos'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
             -DXMLA_REQUIRE_GSS=${{ matrix.os.require_gss }}

      - name: Build
        run: cmake --build build

      # Constitution III: the suite must pass on a machine that has never
      # contacted an Analysis Services instance. Nothing here reaches a network.
      - name: Hermetic protocol tests
        run: ./build/xmla_test

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libkrb5-dev gss-ntlmssp ninja-build
      # The DIME decoder and the sealed-frame reader consume bytes from a remote
      # peer. The unit suite feeds them truncated and malformed input on purpose,
      # so running that suite under sanitizers is nearly free coverage of exactly
      # the code that most needs it.
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - run: cmake --build build
      - run: ./build/xmla_test
