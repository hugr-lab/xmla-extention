name: CI

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter, deliberately. With `branches: [main]` a PR whose base
    # is another branch runs none of this, and stacked PRs are normal. The failure
    # mode is a green tick on a PR that ran four checks instead of fourteen, which
    # looks fine on the page and is only visible by counting them against another
    # PR. Cost is CI minutes on stacked PRs, which is the point.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # For the extension syntax check below: it needs DuckDB's headers
          # CHECKED OUT, not built.
          submodules: recursive

      - name: clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          # -print0/-0 for paths with spaces; -r so an empty list does not invoke
          # clang-format with no arguments, where it reads the already-drained
          # stdin and exits 0 -- a green lint that checked nothing, which is the
          # same failure the leak gate and check_layering.sh both refuse.
          # The count guard is what actually catches a directory rename.
          count=$(find src test tools \( -name '*.cpp' -o -name '*.hpp' \) -print | grep -c '')
          echo "formatting $count file(s)"
          if [ "$count" -eq 0 ]; then
            echo "found 0 sources to format -- the file list is broken, which is not a pass" >&2
            exit 1
          fi
          find src test tools \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 -r clang-format-14 --dry-run --Werror

      # Constitution I. The gate runs on every commit locally; here it runs over
      # EVERY TRACKED FILE, not just a diff, so a token that arrived before the
      # gate did is still found. LEAK_GATE_FILES_CMD is the supported way to
      # point it at a different file list -- and with it set, scanning zero files
      # is an error rather than a pass, because a green run that checked nothing
      # is worse than no job at all.
      - name: Leak gate over every tracked file
        # -z: the gate reads NUL-delimited paths, because core.quotePath otherwise
        # renders a non-ASCII filename as a quoted, escaped string that cannot be
        # read back — and the old code swallowed that failure silently.
        run: LEAK_GATE_FILES_CMD="git ls-files -z" .githooks/pre-commit

      # The gate has failed in three ways that all looked like working: scanning
      # the working tree while listing from the index, an EXIT trap that made
      # every run exit 1, and an OID read as an address. It gets its own tests.
      - name: Leak gate regression tests
        run: ./test/hooks/test_leak_gate.sh

      - name: The protocol layer stays free of DuckDB and of GSSAPI
        run: scripts/ci/check_layering.sh

      # A source edit meant to remove locale-dependent ctype calls silently did
      # not apply, and neither the build nor the tests noticed. This is the
      # deterministic guard for that.
      - name: The wire path does not depend on the process locale
        run: scripts/ci/check_locale_independence.sh

      # src/xmla_extension.cpp compiles ONLY inside the DuckDB build, which no
      # other job runs — unit tests, sanitizers and CodeQL all build standalone.
      # A syntax error there failed nothing anywhere. This needs the submodule
      # checked out but not built, and takes seconds.
      - name: The DuckDB-facing sources compile against DuckDB's headers
        run: scripts/ci/check_extension_compiles.sh

  cpp-unit-tests:
    name: C++ Unit Tests (${{ matrix.os.id }})
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is here to catch BSD/Linux socket divergence in transport, which
        # is the layer most likely to differ. It builds the HERMETIC target set
        # only: Apple's GSS.framework exports no gss_wrap_iov and no NTLM
        # mechanism (research D11), so a client build there would fail for a
        # reason that has nothing to do with the change under test.
        os:
          - id: linux
            runner: ubuntu-latest
            require_gss: 'ON'
          - id: macos
            runner: macos-14
            require_gss: 'OFF'
    steps:
      - uses: actions/checkout@v5

      - name: Install GSSAPI (linux)
        if: matrix.os.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev gss-ntlmssp ninja-build

      - name: Install ninja (macos)
        if: matrix.os.id == 'macos'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
             -DXMLA_REQUIRE_GSS=${{ matrix.os.require_gss }}

      # The DEFAULT target too, not just the tests. `--target xmla_test` alone
      # builds only xmla_test and xmla_protocol — so xmla_gss and xmla_probe were
      # compiled by NO ci job, and a compile or link error in gss_context.cpp
      # failed nothing here. That is the whole reason the linux leg configures
      # with -DXMLA_REQUIRE_GSS=ON.
      - name: Build
        run: cmake --build build

      # Constitution III: the suite must pass on a machine that has never
      # contacted an Analysis Services instance. Nothing here reaches a network.
      - name: Hermetic protocol tests
        run: ./build/xmla_test

  # The SQL surface. Needs the extension BUILT, which the unit-test jobs do not
  # do — they build only the hermetic protocol suite. Every case here is
  # server-free (constitution III); anything needing a live instance is the
  # probe's job.
  sql-tests:
    name: SQL surface (sqllogictest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y libkrb5-dev gss-ntlmssp ninja-build
      # Bounded parallelism: DuckDB's larger translation units get the compiler
      # OOM-killed on a standard runner at full width.
      - run: GEN=ninja CMAKE_BUILD_PARALLEL_LEVEL=2 make release
      - run: ./build/release/test/unittest "test/sql/*"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libkrb5-dev gss-ntlmssp ninja-build
      # The DIME decoder and the sealed-frame reader consume bytes from a remote
      # peer. The unit suite feeds them truncated and malformed input on purpose,
      # so running that suite under sanitizers is nearly free coverage of exactly
      # the code that most needs it.
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - run: cmake --build build
      - run: ./build/xmla_test
