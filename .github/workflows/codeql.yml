name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.cpp'
      - '**.hpp'
      - 'CMakeLists.txt'
      # Its own file, so a change to HOW the analysis is built is verified by
      # running it. Without this, the PR that fixed the build-target scoping
      # could not trigger CodeQL at all, and "no CodeQL comments" on it carried
      # no information. kerberos.yml lists itself for the same reason.
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 4 * * 2'

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libkrb5-dev ninja-build

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-and-quality

      # -DXMLA_BUILD_TESTS=OFF keeps test/cpp out of the database. The exclusion
      # is requested HERE rather than imposed in CMakeLists.txt, where it broke
      # `ctest` and the README's build-then-run instructions for everyone else.
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXMLA_BUILD_TESTS=OFF

      # Build ONLY the shipped targets. For a compiled language CodeQL analyses
      # exactly what the build compiles, so this — not paths-ignore — is how test
      # code is kept out of the database.
      #
      # paths-ignore was tried first and does not work here: it is honoured for
      # interpreted languages, and for C++ the config was read, the augmented
      # file showed the setting, and the analysis still returned all 90 test
      # findings. Every TEST_CASE expands to a static registered through a
      # function pointer, which CodeQL cannot follow, so each one reports as an
      # unreachable static — 90 findings that will never be actionable.
      #
      # src/ and tools/ stay fully analysed, which is the point: the same query
      # found a real defect there (two ASCII helpers with no call sites, because
      # a locale fix had silently failed to apply). Excluding the query
      # repo-wide would have thrown that away; excluding the test TARGET does
      # not.
      # The DEFAULT target, which builds only what ships: xmla_test is excluded by the
      # -DXMLA_BUILD_TESTS=OFF on the configure line above — NOT by CMakeLists.txt,
      # which defaults it ON so `ctest` and the README's build-then-run work.
      # Dropping that flag silently puts test/cpp back in the database. A hardcoded list here would silently
      # drop any new shipped target — the DuckDB extension target most of all,
      # which does not exist yet — and nothing would fail; the database would
      # just quietly stop covering it.
      - run: cmake --build build

      - uses: github/codeql-action/analyze@v3
